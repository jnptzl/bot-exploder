<!DOCTYPE html>
<html>
<head>
  <title>Bot Exploder - Icon Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    h1 { color: #ff4500; }
    canvas {
      border: 1px solid #333;
      margin: 10px;
      border-radius: 8px;
    }
    .icons { display: flex; gap: 20px; flex-wrap: wrap; align-items: end; }
    button {
      background: #ff4500;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }
    button:hover { background: #ff6b35; }
    .instructions {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }
    code {
      background: #3a3a3a;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Bot Exploder Icon Generator</h1>
  <p>Click the button to download the extension icons.</p>

  <div class="icons">
    <div>
      <canvas id="icon16" width="16" height="16"></canvas>
      <p>16x16</p>
    </div>
    <div>
      <canvas id="icon48" width="48" height="48"></canvas>
      <p>48x48</p>
    </div>
    <div>
      <canvas id="icon128" width="128" height="128"></canvas>
      <p>128x128</p>
    </div>
  </div>

  <button onclick="downloadAll()">Download All Icons</button>

  <div class="instructions">
    <h3>Instructions:</h3>
    <ol>
      <li>Click "Download All Icons" above</li>
      <li>Move the downloaded files to the <code>assets/</code> folder</li>
      <li>Load the extension in Chrome at <code>chrome://extensions</code></li>
    </ol>
  </div>

  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const center = size / 2;
      const radius = size * 0.4;

      // Background circle
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ff4500';
      ctx.fill();

      // Explosion rays
      ctx.strokeStyle = '#ffdd00';
      ctx.lineWidth = Math.max(1, size / 16);
      const rayCount = 8;
      const innerRadius = radius * 0.5;
      const outerRadius = radius * 1.3;

      for (let i = 0; i < rayCount; i++) {
        const angle = (i / rayCount) * Math.PI * 2 - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(
          center + Math.cos(angle) * innerRadius,
          center + Math.sin(angle) * innerRadius
        );
        ctx.lineTo(
          center + Math.cos(angle) * outerRadius,
          center + Math.sin(angle) * outerRadius
        );
        ctx.stroke();
      }

      // Center white flash
      ctx.beginPath();
      ctx.arc(center, center, radius * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }

    // Draw all icons
    ['icon16', 'icon48', 'icon128'].forEach(id => {
      drawIcon(document.getElementById(id));
    });

    function downloadCanvas(canvas, filename) {
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function downloadAll() {
      downloadCanvas(document.getElementById('icon16'), 'icon16.png');
      setTimeout(() => downloadCanvas(document.getElementById('icon48'), 'icon48.png'), 100);
      setTimeout(() => downloadCanvas(document.getElementById('icon128'), 'icon128.png'), 200);
    }
  </script>
</body>
</html>
