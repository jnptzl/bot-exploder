<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>X fixture</title>
  <style>
    body { margin: 0; background: #fff; font-family: sans-serif; }
    [data-testid="primaryColumn"] { width: 600px; margin: 0 auto; }
    article { border-bottom: 1px solid #eee; padding: 12px; min-height: 120px; }
    #layers { position: fixed; top: 0; left: 0; width: 100%; z-index: 100; }
    [role="dialog"], [role="menu"] { background: #fff; border: 1px solid #000; margin: 40px auto; width: 300px; padding: 8px; }
    .spacer { height: 3000px; }
  </style>
</head>
<body>
  <div data-testid="primaryColumn">
    <div id="timeline"></div>
    <div class="spacer"></div>
  </div>
  <div data-testid="sidebarColumn" style="position: absolute; top: 0; right: 0; width: 300px;">
    <div><form role="search"><input data-testid="SearchBox_Search_Input"></form></div>
    <div id="modules">
      <div class="module"><div><h2 role="heading"><span>Live on X</span></h2></div><div>Bits + Bips</div></div>
    </div>
  </div>
  <div id="layers"></div>

  <script>
    // Minimal mimic of X's DOM: tweets, caret menu, and a 3-step report dialog in #layers
    window.__clicks = [];
    const log = (what) => window.__clicks.push(what);

    function tweetHTML({ user, text, retweeter, ad, video }) {
      return `
        <article data-testid="tweet" data-user="${user}">
          ${retweeter ? `<a href="/${retweeter}"><span data-testid="socialContext">${retweeter} reposted</span></a>` : ''}
          <a href="/${user}"><img alt=""></a>
          <div data-testid="User-Name">
            <a href="/${user}"><span>${user}</span></a>
            <a href="/${user}/status/1"><span>1h</span></a>
            ${ad ? '<span>Ad</span>' : ''}
          </div>
          <button data-testid="caret" aria-label="More">…</button>
          <div data-testid="tweetText"><span>${text}</span></div>
          ${video ? `
            <div data-testid="videoPlayer">
              <div data-testid="videoComponent"><video playsinline></video></div>
              <button class="x-play" aria-label="Play">▶</button>
              <button class="x-mute" aria-label="Mute">🔊</button>
            </div>` : ''}
          <div role="group" aria-label="actions">
            <button data-testid="reply">r</button>
            <button data-testid="like">l</button>
          </div>
        </article>`;
    }

    // X loads sidebar modules lazily
    window.addSidebarModules = () => {
      document.getElementById('modules').insertAdjacentHTML('beforeend', `
        <div class="module"><section><div><h2 role="heading"><span>What’s happening</span></h2></div>
          <div data-testid="trend">Trending in Argentina</div></section></div>
        <div class="module"><aside aria-label="Who to follow"><div><h2 role="heading"><span>Who to follow</span></h2></div>
          <div data-testid="UserCell">@habit_py</div></aside></div>`);
    };

    window.addTweet = (t) => {
      document.getElementById('timeline').insertAdjacentHTML('beforeend', tweetHTML(t));
    };

    addTweet({ user: 'bot_one', text: 'Click Next then Done' });
    addTweet({ user: 'real_author', retweeter: 'friendly_rt', text: 'retweeted content' });
    addTweet({ user: 'advertiser', text: 'Buy stuff', ad: true });
    addTweet({ user: 'video_user', text: 'video', video: true });
    addTweet({ user: 'video_two', text: 'another video', video: true });

    // X's player, roughly. It keeps its own idea of whether it's playing,
    // set by the outcome of its own play()/pause() calls rather than by media
    // events, and its play/pause button and clicks on the video act on that
    // idea. It autoplays posts in view until you pause one, and remembers
    // that you unmuted.
    window.__xMuted = false;
    const xState = new WeakMap();

    const xVideo = (player) => player.querySelector('video');

    function xInit(player, reset) {
      if (reset || !xState.has(player)) xState.set(player, { playing: false, userPaused: false, attempts: 0 });
    }

    function xRender(player) {
      player.querySelector('.x-play').setAttribute('aria-label', xState.get(player).playing ? 'Pause' : 'Play');
    }

    function xPlay(player) {
      const s = xState.get(player);
      return xVideo(player).play()
        .then(() => { s.playing = true; }, () => { s.playing = false; })
        .finally(() => xRender(player));
    }

    function xPause(player) {
      const s = xState.get(player);
      xVideo(player).pause();
      s.playing = false;
      s.userPaused = true;
      xRender(player);
    }

    window.xToggle = (player) => xState.get(player).playing ? xPause(player) : xPlay(player);

    function wireVideo(video) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 16;
      const g = canvas.getContext('2d');
      setInterval(() => { g.fillStyle = `hsl(${Math.random() * 360},50%,50%)`; g.fillRect(0, 0, 16, 16); }, 50);
      video.srcObject = canvas.captureStream(10);
      video.muted = window.__xMuted;
    }

    document.querySelectorAll('video').forEach(wireVideo);
    document.querySelectorAll('[data-testid="videoPlayer"]').forEach(xInit);

    // Autoplay as a video comes into view: a few tries (scrolling in and out),
    // then X gives up and waits for a click
    setInterval(() => {
      document.querySelectorAll('[data-testid="videoPlayer"]').forEach(player => {
        xInit(player);
        const s = xState.get(player);
        if (!s.playing && !s.userPaused && s.attempts < 2) {
          s.attempts++;
          xPlay(player);
        }
      });
    }, 300);

    document.addEventListener('click', (e) => {
      const player = e.target.closest('[data-testid="videoPlayer"]');
      if (!player) return;

      if (e.target.closest('.x-mute')) {
        window.__xMuted = !window.__xMuted;
        xVideo(player).muted = window.__xMuted;
        e.target.closest('.x-mute').setAttribute('aria-label', window.__xMuted ? 'Unmute' : 'Mute');
      } else if (e.target.closest('.x-play') || e.target.matches('video')) {
        xToggle(player);
      }
    });

    // X re-mounts the <video> element when a post re-renders
    window.swapVideo = (user) => {
      const old = document.querySelector(`article[data-user="${user}"] video`);
      const fresh = document.createElement('video');
      fresh.playsInline = true;
      wireVideo(fresh);
      old.replaceWith(fresh);
      xInit(fresh.closest('[data-testid="videoPlayer"]'), true);
    };

    // Decoys in the timeline that a document-wide text search would hit
    document.getElementById('timeline').insertAdjacentHTML('beforeend', `
      <div role="button" onclick="__clicks.push('DECOY next')">Next</div>
      <div role="button" onclick="__clicks.push('DECOY block')">Block</div>
      <div role="button" onclick="__clicks.push('DECOY done')">Done</div>
      <label onclick="__clicks.push('DECOY spam')">Spam</label>`);

    const layers = document.getElementById('layers');

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { log('escape'); layers.innerHTML = ''; }
    });

    document.addEventListener('click', (e) => {
      const caret = e.target.closest('[data-testid="caret"]');
      if (caret) {
        const user = caret.closest('article').dataset.user;
        log('caret ' + user);
        layers.innerHTML = `
          <div role="menu">
            <div role="menuitem">Not interested in this post</div>
            <div role="menuitem" data-action="report" data-user="${user}">Report post</div>
          </div>`;
        return;
      }

      if (e.target.matches('input')) return; // label's synthetic click
      const el = e.target.closest('#layers [role], #layers label, #layers button');
      if (!el) return;
      const text = el.textContent.replace(/\s+/g, ' ').trim();
      log(text);

      if (el.dataset.action === 'report') {
        showStep1(el.dataset.user);
      } else if (el.matches('label')) {
        el.closest('[role="dialog"]').querySelector('[data-next]').setAttribute('aria-disabled', 'false');
      } else if (el.dataset.next === '1') {
        showStep2(el.dataset.user);
      } else if (el.dataset.next === '2') {
        showStep3(el.dataset.user);
      } else if (el.dataset.block) {
        layers.querySelector('[role="dialog"]').insertAdjacentHTML('beforeend',
          `<div role="button" data-testid="confirmationSheetConfirm">Block</div>`);
      } else if (el.dataset.testid === 'confirmationSheetConfirm') {
        window.__blocked = el.closest('[role="dialog"]').dataset.user;
        el.remove();
      } else if (el.dataset.done) {
        window.__reported = (window.__reported || []).concat(el.dataset.user);
        layers.innerHTML = '';
      }
    });

    function showStep1(user) {
      layers.innerHTML = `
        <div role="dialog" data-user="${user}">
          <label><input type="radio" name="c"><span>Hate</span><span>Slurs, racist imagery</span></label>
          <label><input type="radio" name="c"><span>Spam</span><span>Fake engagement, scams, fake accounts</span></label>
          <button data-next="1" data-user="${user}" aria-disabled="true">Next</button>
        </div>`;
    }

    function showStep2(user) {
      // Rendered asynchronously, like X
      layers.innerHTML = '';
      setTimeout(() => {
        layers.innerHTML = `
          <div role="dialog" data-user="${user}">
            <label><input type="radio" name="s"><span>Fake engagement</span></label>
            <label><input type="radio" name="s"><span>Scams</span></label>
            <button data-next="2" data-user="${user}" aria-disabled="true">Next</button>
          </div>`;
      }, 300);
    }

    function showStep3(user) {
      layers.innerHTML = `
        <div role="dialog" data-user="${user}">
          <p>Thanks for helping make X better.</p>
          <div role="button" data-block="1">Block @${user}</div>
          <div role="button">Mute @${user}</div>
          <div role="button" data-done="1" data-user="${user}">Done</div>
        </div>`;
    }
  </script>
</body>
</html>
